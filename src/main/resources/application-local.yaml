spring :
  application :
    name : fz-matching-service
  datasource:
    url : jdbc:mysql://localhost:3306/frenzo_dev
    username : root
    password : root
    driver-class-name : com.mysql.cj.jdbc.Driver
  jpa :
    hibernate :
      ddl-auto : update
    show-sql : true

server :
  port : 9091

eureka :
  client:
    fetch-registry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:7070/eureka/
  instance:
    preferIpAddress : true

info:
  app:
   name: matching
   description: matching-service
   version: 0.0.1

management:
  endpoints:
     web:
       exposure:
         include: "*"
  info:
     env:
       enabled: true

